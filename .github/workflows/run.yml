name: FModel-JP- exe Builder

on:
  push:
    branches: [ main, FModelJP-Renewal ]

permissions:
  contents: write

# main と FModelJP-Renewal が同時に push された場合でも、同じ Release / 更新 API を
# 同時更新しないよう直列化する。
concurrency:
  group: fmodel-jp-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: .NET 10 Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # publish より先にネイティブを作る。ここで作った DLL を publish に渡して exe へ埋め込む。
      - name: Build CUE4Parse-Natives
        id: natives
        shell: pwsh
        run: |
          cmake -S "./CUE4Parse/CUE4Parse-Natives" -B "./CUE4Parse/CUE4Parse-Natives/build-gha"
          cmake --build "./CUE4Parse/CUE4Parse-Natives/build-gha" --config Release

          $candidates = @(
            "./CUE4Parse/CUE4Parse-Natives/build-gha/Release/CUE4Parse-Natives.dll",
            "./CUE4Parse/CUE4Parse-Natives/build-gha/CUE4Parse-Natives.dll",
            "./CUE4Parse/CUE4Parse-Natives/bin/Release/CUE4Parse-Natives.dll"
          )

          $dll = $null
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              $item = Get-Item $candidate
              if ($item.Length -gt 0) {
                $dll = $item.FullName
                break
              }
            }
          }

          if (-not $dll) {
            throw "CUE4Parse-Natives.dll was not produced by CI build."
          }

          Write-Host "Built native DLL: $dll"
          "dll=$dll" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: .NET Restore
        run: dotnet restore "./FModel/FModel.slnx" -r win-x64

      # CUE4PARSE_SKIP_NATIVE: ビルド中の cmake は上で作った DLL と重複するので走らせない
      - name: .NET Publish
        env:
          CUE4PARSE_SKIP_NATIVE: 'true'
        run: dotnet publish "./FModel/FModel.csproj" -c Release --no-restore --self-contained true -r win-x64 -f net10.0-windows -o "./FModel/bin/Publish/" -p:PublishReadyToRun=false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:GenerateDocumentationFile=false -p:DebugSymbols=false -p:CUE4ParseNativeDll="${{ steps.natives.outputs.dll }}"

      # exe 単体で配布しても動くよう、ネイティブが本当に埋め込まれたかを確認する
      # (単一ファイルバンドルのマニフェストはファイル末尾側に置かれる)
      - name: Verify CUE4Parse-Natives.dll Is Embedded
        shell: pwsh
        run: |
          $exe = (Resolve-Path "./FModel/bin/Publish/FModel.exe").Path
          $stream = [IO.File]::OpenRead($exe)
          try {
            $length = [Math]::Min(32MB, $stream.Length)
            $stream.Seek(-$length, [IO.SeekOrigin]::End) | Out-Null
            $buffer = New-Object byte[] $length
            $read = $stream.Read($buffer, 0, $length)
          } finally {
            $stream.Dispose()
          }

          $manifest = [Text.Encoding]::UTF8.GetString($buffer, 0, $read)
          if (-not $manifest.Contains("CUE4Parse-Natives.dll")) {
            throw "CUE4Parse-Natives.dll is not embedded in FModel.exe."
          }

          Write-Host "CUE4Parse-Natives.dll is embedded in FModel.exe."

      # exe には埋め込み済みだが、旧バージョンから更新した環境に残る古い DLL を上書きするため ZIP にも入れる
      - name: Bundle CUE4Parse-Natives.dll
        shell: pwsh
        run: |
          Copy-Item "${{ steps.natives.outputs.dll }}" "./FModel/bin/Publish/CUE4Parse-Natives.dll" -Force

      - name: Get App Version
        id: package_version
        uses: kzrnm/get-net-sdk-project-versions-action@v2
        with:
          proj-path: ./FModel/FModel.csproj

      # ZipExtractor (AutoUpdater.NET) は ZIP の中身をそのままアプリのフォルダへ展開するため、
      # FModel.exe を必ずルート直下に置く。親フォルダを含めると本体が更新されない。
      - name: Create ZIP File
        shell: pwsh
        run: |
          $publishDir = (Resolve-Path "./FModel/bin/Publish").Path
          Get-ChildItem -Path $publishDir -Filter "*.pdb" -Recurse | Remove-Item -Force

          $zip = Join-Path (Get-Location).Path "${{ steps.package_version.outputs.version }}-${{ github.sha }}.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }

          [IO.Compression.ZipFile]::CreateFromDirectory($publishDir, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)

          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries.FullName)
          } finally {
            $archive.Dispose()
          }

          Write-Host ("ZIP entries:`n" + ($entries -join "`n"))
          if ($entries -notcontains "FModel.exe") {
            throw "FModel.exe must be at the root of the ZIP."
          }

      - name: Add Release
        id: release
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: 'FModel-JP- v${{ steps.package_version.outputs.version }}'
          tag: '${{ steps.package_version.outputs.version }}'
          commit: ${{ github.sha }}
          body: |
            初回の場合、下の ZIP をダウンロードして展開するか、FModel.exe を直接ダウンロードしてください。
            実行した際にアップデート情報が表示されたら、アップデートを実行してください。

            Version: `${{ steps.package_version.outputs.version }}`
            Build: `${{ github.sha }}`
          # release-action の artifacts はカンマ区切り。改行区切りだと成果物を
          # 正しく解釈できないバージョンがあるため、明示的に1行で指定する。
          artifacts: '${{ steps.package_version.outputs.version }}-${{ github.sha }}.zip,./FModel/bin/Publish/FModel.exe'
          artifactErrorsFailBuild: true
          allowUpdates: true
          makeLatest: true
          replacesArtifacts: true

      # Release 作成が success でも asset が欠けた状態では更新 API を変更しない。
      - name: Verify Release Assets
        id: release_assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.package_version.outputs.version }}"
          $expectedZip = "${{ steps.package_version.outputs.version }}-${{ github.sha }}.zip"

          $releaseJson = gh api "repos/${{ github.repository }}/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read GitHub Release '$tag'."
          }

          $release = $releaseJson | ConvertFrom-Json
          $zipAsset = $release.assets | Where-Object { $_.name -eq $expectedZip } | Select-Object -First 1
          $exeAsset = $release.assets | Where-Object { $_.name -eq "FModel.exe" } | Select-Object -First 1

          if (-not $zipAsset -or $zipAsset.size -le 0) {
            throw "Release asset '$expectedZip' is missing or empty."
          }
          if (-not $exeAsset -or $exeAsset.size -le 0) {
            throw "Release asset 'FModel.exe' is missing or empty."
          }

          Write-Host "Verified ZIP: $($zipAsset.browser_download_url) ($($zipAsset.size) bytes)"
          Write-Host "Verified EXE: $($exeAsset.browser_download_url) ($($exeAsset.size) bytes)"
          "download_url=$($zipAsset.browser_download_url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 旧 5.7.0.0 系の exe は「バージョン管理」でリリースタグ 'qa' の "<sha>.zip" しか
      # 参照しないため、新しいタグに積むだけでは更新を提示できない。同じ ZIP を 'qa' にも
      # レガシー名で積んで橋渡しする。旧バージョンの利用者がいなくなったら削除してよい。
      - name: Create Legacy QA Asset
        shell: pwsh
        run: |
          $source = "${{ steps.package_version.outputs.version }}-${{ github.sha }}.zip"
          $legacy = "${{ github.sha }}.zip"
          if (Test-Path $legacy) { Remove-Item $legacy -Force }
          Copy-Item $source $legacy -Force

      - name: Add Legacy QA Release Asset
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: 'qa'
          artifacts: '${{ github.sha }}.zip'
          artifactErrorsFailBuild: true
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          makeLatest: false
          replacesArtifacts: true

      - name: Install Requests
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements.txt

      - name: Set Secrets
        run: |
          echo '${{ secrets.SECRETS }}' > secrets.py

      - name: Update Download Url
        run: |
          python Update_DownloadUrl.py "${{ github.sha }}" "${{ steps.package_version.outputs.version }}" "${{ steps.release_assets.outputs.download_url }}"
