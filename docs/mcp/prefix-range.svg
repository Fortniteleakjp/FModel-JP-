<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">fmodel_browse の仕組み：パス順配列の二分探索 + 連続区間の一括集計</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#475569">例：path = "FortniteGame/Content/UI"（prefix = "FortniteGame/Content/UI/"）</text>

  <!-- array -->
  <g font-family="Consolas,'Cascadia Mono',monospace" font-size="12" xml:space="preserve">
    <rect x="40" y="76" width="560" height="28" fill="#f8fafc" stroke="#cbd5e1"/><text x="50" y="95" fill="#94a3b8">[i-1] FortniteGame/Content/Sounds/…/S_Click.uasset</text>
    <rect x="40" y="104" width="560" height="28" fill="#dcfce7" stroke="#86efac"/><text x="50" y="123" fill="#14532d">[s]   FortniteGame/Content/UI/Foundation/A.uasset</text>
    <rect x="40" y="132" width="560" height="28" fill="#dcfce7" stroke="#86efac"/><text x="50" y="151" fill="#14532d">      FortniteGame/Content/UI/Foundation/B.uasset</text>
    <rect x="40" y="160" width="560" height="28" fill="#dcfce7" stroke="#86efac"/><text x="50" y="179" fill="#14532d">      FortniteGame/Content/UI/Foundation/Textures/T.uasset</text>
    <rect x="40" y="188" width="560" height="28" fill="#dbeafe" stroke="#93c5fd"/><text x="50" y="207" fill="#1e3a8a">      FortniteGame/Content/UI/HUD/W_Hud.uasset</text>
    <rect x="40" y="216" width="560" height="28" fill="#dbeafe" stroke="#93c5fd"/><text x="50" y="235" fill="#1e3a8a">      FortniteGame/Content/UI/HUD/W_Map.uasset</text>
    <rect x="40" y="244" width="560" height="28" fill="#fef3c7" stroke="#fcd34d"/><text x="50" y="263" fill="#78350f">      FortniteGame/Content/UI/T_Logo.uasset</text>
    <rect x="40" y="272" width="560" height="28" fill="#f8fafc" stroke="#cbd5e1"/><text x="50" y="291" fill="#94a3b8">[e]   FortniteGame/Content/Weapons/…</text>
  </g>
  <text x="40" y="320" font-size="11" fill="#64748b">Files は Provider.Files を OrdinalIgnoreCase で並べた配列（McpSession.Files がキャッシュ）</text>

  <!-- brackets -->
  <path d="M606,106 H618 V270 H606" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="626" y="190" font-size="12" fill="#166534">[start, end)</text>

  <!-- explanation -->
  <g font-size="13" fill="#0f172a">
    <rect x="700" y="76" width="276" height="96" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="712" y="98" font-weight="700" fill="#14532d">① PrefixRange</text>
    <text x="712" y="120" font-size="12" fill="#166534">lower bound を二分探索で求め、</text>
    <text x="712" y="140" font-size="12" fill="#166534">StartsWith が続く所まで end を進める</text>
    <text x="712" y="160" font-size="12" fill="#166534">O(log N + 区間)、N = 125 万でも即時</text>

    <rect x="700" y="186" width="276" height="114" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="712" y="208" font-weight="700" fill="#1e3a8a">② 区間を 1 回だけ走査</text>
    <text x="712" y="230" font-size="12" fill="#1e40af">残りに "/" がある → サブフォルダ</text>
    <text x="712" y="250" font-size="12" fill="#1e40af">同じフォルダは必ず連続するので、</text>
    <text x="712" y="270" font-size="12" fill="#1e40af">末尾と同じなら件数 +1 するだけ</text>
    <text x="712" y="290" font-size="12" fill="#1e40af">（辞書もソートも不要）</text>
  </g>

  <!-- result -->
  <rect x="40" y="340" width="936" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="364" font-size="14" font-weight="700" fill="#0f172a">③ 結果（folders → files の順でページング：items / total / offset / nextOffset）</text>
  <g font-family="Consolas,'Cascadia Mono',monospace" font-size="12">
    <text x="56" y="390" fill="#14532d">{ kind: "folder", path: "FortniteGame/Content/UI/Foundation/", recursiveFileCount: 3 }</text>
    <text x="56" y="410" fill="#1e3a8a">{ kind: "folder", path: "FortniteGame/Content/UI/HUD/",        recursiveFileCount: 2 }</text>
    <text x="56" y="430" fill="#78350f">{ kind: "file",   file: { path: "…/UI/T_Logo.uasset", size, extension, isPackage, archive … } }</text>
  </g>
</svg>
